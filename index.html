<style>
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --ink:#1C2333; --ink-soft:#5B6478;
    --line:#E2E5EB; --accent:#3450A3; --accent-soft:#EAEEFA;
    --danger:#B3432B; --danger-soft:#FBEDE8; --ok:#2C7A57; --ok-soft:#E8F4EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:760px; margin:0 auto; padding:24px 20px 80px;}
  .topbar{
    position:sticky; top:0; background:var(--bg); padding:14px 0; z-index:10;
    display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .topbar .label{font-size:13px; color:var(--ink-soft);}
  .topbar .section-name{font-size:16px; font-weight:600;}
  .timer{
    font-variant-numeric:tabular-nums; font-size:15px; font-weight:600;
    background:var(--accent-soft); color:var(--accent); padding:6px 14px; border-radius:8px;
  }
  .timer.warn{background:var(--danger-soft); color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; margin-bottom:20px;
  }
  h1{font-size:26px; margin:0 0 8px;}
  h2{font-size:19px; margin:0 0 4px;}
  h3{font-size:15px; color:var(--ink-soft); font-weight:600; margin:0 0 16px;}
  p{margin:0 0 14px;}
  .muted{color:var(--ink-soft); font-size:14px;}
  input[type=text]{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; margin-bottom:14px; font-family:inherit;
  }
  button{
    font-family:inherit; font-size:14px; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:#fff; padding:10px 18px; color:var(--ink); transition:background .15s;
  }
  button:hover{background:#F1F2F5;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .btn-primary:hover{background:#2A4183;}
  .btn-primary:disabled{background:var(--accent); opacity:.4;}
  .navrow{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
  .audio-box{
    display:flex; align-items:center; gap:14px; background:var(--accent-soft);
    border-radius:10px; padding:16px 18px; margin-bottom:20px;
  }
  .play-btn{
    width:48px; height:48px; border-radius:50%; background:var(--accent); border:none;
    color:#fff; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .play-btn:disabled{background:#9AA6C4;}
  .audio-meta{font-size:13px; color:var(--accent); flex:1;}
  .audio-progress{height:5px; background:#D3DAF0; border-radius:2px; margin-top:8px; overflow:hidden;}
  .audio-progress-fill{height:100%; background:var(--accent); width:0%; transition:width .2s linear;}
  .audio-time{font-size:12px; color:var(--accent); margin-top:4px; font-variant-numeric:tabular-nums;}
  .qnum{font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .stem{font-size:16px; margin-bottom:16px;}
  .choice{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; margin-bottom:9px; cursor:pointer;
  }
  .choice:hover{border-color:#B9C0D6;}
  .choice.selected{border-color:var(--accent); background:var(--accent-soft);}
  .choice input{margin-top:3px;}
  .passage{
    background:#FBFBFC; border:1px solid var(--line); border-radius:10px; padding:18px 20px;
    margin-bottom:20px; font-size:15px; max-height:340px; overflow-y:auto;
  }
  .passage h4{margin:0 0 10px; font-size:15px;}
  .palette{display:flex; flex-wrap:wrap; gap:6px; margin-top:18px;}
  .palette button{width:32px; height:32px; padding:0; font-size:12px; border-radius:6px;}
  .palette button.answered{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
  .palette button.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .instructions{font-size:14px; color:var(--ink-soft); font-style:italic; margin-bottom:18px;}
  .score-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:20px 0;}
  .score-cell{background:var(--accent-soft); border-radius:10px; padding:16px; text-align:center;}
  .score-cell .num{font-size:24px; font-weight:700; color:var(--accent);}
  .score-cell .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .warn-box{background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:12px 14px; font-size:13px; margin-top:10px;}
  .ok-box{background:var(--ok-soft); color:var(--ok); border-radius:8px; padding:12px 14px; font-size:13px; margin-top:10px;}
  .listen-item{border-top:1px solid var(--line); padding:16px 0;}
  .listen-item:first-child{border-top:none; padding-top:0;}
  .listen-part-label{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em; margin:22px 0 4px;}
  .listen-part-label:first-child{margin-top:0;}
  a{color:var(--accent);}
</style>
</head>

 {title:"Passage 1 — Horse Breeding", text:`Horse owners who plan to breed one or more mares should have a working knowledge of heredity and know how to care for breeding animals and foals. The number of mares bred that conceive varies from about 40 to 85 percent, with the average running less than 50 percent. Some mares that do conceive fail to produce living foals. This means that, on average, two mares are kept a whole year to produce one foal, and even then, some foals are disappointments from the standpoint of quality.

The Thoroughbred is considered by many to be the highpoint of elegance and fine selective breeding. Many persons mistakenly apply the name Thoroughbred to any purebred horse. But a Thoroughbred is a distinct breed of running horses that traces its ancestry through the male line directly back to three Eastern stallions as the Byerly Turk, the Darley Arabian, and the Godolphin Barb. For convenience the breeds of horses are often divided into three major groups: first is ponies; second is heavy, or draft horses; and the last is light horses.`,

 {title:"Passage 2 — Archaeology as History", text:`Archaeology is a source of history, not just a humble auxiliary discipline. Archaeological data are historical documents, not mere illustrations to written texts. Just as much as any other historian, an archaeologist studies and tries to reconstitute the process that has created the human world in which we live and us ourselves in so far as we are each creature of our age and social environment. Archaeological data are all changes in the material world resulting from human action, or more succinctly, the fossilized results of human behavior. The sum of these constitutes what may be called the archaeological record, which exhibits certain peculiarities and deficiencies, the consequences of which produce a rather superficial contrast between archaeological history and the more familiar kind based upon written records.

Not all human behavior fossilizes. The words I utter and you hear as vibrations in the air are certainly human changes in the material world and may be of great historical significance. Yet they leave no sort of trace in the archaeological record unless they are captured by a dictaphone or written down by a clerk. The movement of troops on the battlefield may "change the course of history", but this is equally ephemeral from the archaeologist's standpoint. What is perhaps worse, most organic materials are perishable. Everything made of wood, hide, wool, linen, grass, hair, and similar materials will decay and vanish in dust in a few years or centuries, save under very exceptional conditions. In a relatively brief period, the archaeological record is reduced to mere scraps of stone, bone, glass, metal, and earthenware. Still, modern archaeology, by applying appropriate techniques and comparative methods, aided by a few lucky finds from peat bogs, deserts, and frozen soils, can fill up a good deal of the gap.`,

 {title:"Passage 4 — The Alaska Pipeline", text:`The Alaska pipeline starts at the frozen edge of the Arctic Ocean. It stretches southward across the largest and northernmost state in the United States, ending at a remote ice-free seaport village nearly 800 miles from where it begins. It is massive in size and extremely complicated to operate.

The steel pipe crosses windswept plains and endless miles of delicate tundra that tops the frozen ground. It weaves through crooked canyons, climbs sheer mountains, plunges over rocky crags, makes its way through thick forests, and passes over or under hundreds of rivers and streams. The pipe is 4 feet in diameter, and up to 2 million barrels (or 84 million gallons) of crude oil can be pumped through it daily.

Resting on H-shaped steel racks called "bents," long sections of the pipeline follow a zigzag course high above the frozen earth. Other long sections drop out of sight beneath spongy or rocky ground and return to the surface later on. The pattern of the pipeline's up-and-down route is determined by the often harsh demands of the arctic and subarctic climate, the tortuous lay of the land, and the varied compositions of soil, rock, or permafrost (permanently frozen ground). A little more than half of the pipeline is elevated above the ground. The remainder is buried anywhere from 3 to 12 feet, depending largely upon the type of terrain and the properties of the soil.

One of the largest in the world, the pipeline cost approximately $8 billion and is by far the biggest and most expensive construction project ever undertaken by private industry. In fact, no single business could raise that much money, so 8 major oil companies formed a consortium in order to share the costs. Each company controlled oil rights to particular shares of land in the oil fields and paid into the pipeline-construction fund according to the size of its holdings. Today, despite enormous problems of climate, supply shortages, equipment breakdowns, labor disagreements, treacherous terrain, a certain amount of mismanagement, and even theft, the Alaska pipeline has been completed and is operating.`,

 {title:"Passage 7 — Coral Reefs and Ocean Ecosystems", text:`Coral reefs are often called the rainforests of the sea because of the extraordinary diversity of life they support. Although reefs cover less than one percent of the ocean floor, they are home to roughly a quarter of all known marine species. This remarkable biodiversity arises from the complex three-dimensional structures that corals build over centuries, creating countless nooks and crevices where fish, crustaceans, and other organisms can shelter, feed, and reproduce. Corals themselves are not plants but colonies of tiny animals called polyps, which form a symbiotic relationship with microscopic algae living within their tissues. These algae, known as zooxanthellae, provide the coral with food through photosynthesis and are responsible for the vibrant colors reefs display. In exchange, the coral offers the algae a protected environment and access to sunlight. This partnership is delicate, however; when water temperatures rise even slightly above normal, corals often expel their algae in a stress response known as bleaching, leaving the coral white and vulnerable to starvation and disease. Rising ocean temperatures linked to climate change have caused increasingly frequent and severe bleaching events worldwide, threatening the long-term survival of reef ecosystems and the countless species, including humans, that depend on them.`,

 {title:"Passage 8 — The Evolution of the Telephone", text:`When Alexander Graham Bell patented the telephone in 1876, few people imagined how thoroughly it would transform daily life. The earliest telephones required users to manually crank a handle to generate an electrical signal, and calls had to be routed through human operators sitting at switchboards, physically connecting wires between callers. This labor-intensive system remained standard well into the twentieth century, even as the number of telephone users grew into the millions. The invention of automatic switching equipment gradually eliminated the need for operators on most calls, allowing subscribers to dial numbers directly. Rotary dial phones, which dominated households for decades, were eventually replaced by touch-tone models in the 1960s, offering faster and more reliable dialing. The most dramatic transformation, however, came with the shift from analog to digital technology in the late twentieth century, followed by the rise of mobile phones. Early mobile phones were bulky, expensive, and limited to voice calls, but successive generations of wireless technology steadily added capabilities such as text messaging, internet access, and eventually the sophisticated computing power found in modern smartphones. Today's devices bear little resemblance to Bell's original invention, yet they still perform its most fundamental function: allowing people to communicate across distances instantly.`,

let items = [];
structureItems.forEach(it => items.push({section:"Structure", part:it.part, id:it.id, q:it.q, choices:it.choices, answer:it.answer}));
readingPassages.forEach((p) => p.items.forEach(it => items.push({section:"Reading", part:p.title, passage:p.text, passageTitle:p.title, id:it.id, q:it.q, choices:it.choices, answer:it.answer})));

/* =========================================================
   STATE
========================================================= */
let state = {
  screen: "start",
  participant: {name:"", id:""},
  idx: 0,
  answers: {},
  listeningPlayed: false,
  listeningStarted: false,
  sectionStart: {},
};

const app = document.getElementById("app");

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), sec = s%60;
  return m+":"+String(sec).padStart(2,"0");
}
function currentSection(){ return items[state.idx] ? items[state.idx].section : null; }
function sectionIndices(sec){ return items.map((it,i)=>({it,i})).filter(x=>x.it.section===sec).map(x=>x.i); }

/* =========================================================
   RENDER: START SCREEN
========================================================= */
function renderStart(){
  app.innerHTML = `
    <div class="card">
      <h1>TOEFL Practice Test</h1>
      <p class="muted">Listening Comprehension • Structure and Written Expression • Reading Comprehension</p>
      <p>Tes ini terdiri dari 3 bagian: Listening (50 soal, audio diputar sekali), Structure (50 soal), dan Reading (50 soal). Gunakan headphone untuk bagian listening dan pastikan koneksi internet stabil.</p>
      <label for="pnim" style="font-size:14px; font-weight:600;">NIM / Nomor Peserta</label>
      <input type="text" id="pnim" placeholder="Masukkan NIM">
      <label for="ppass" style="font-size:14px; font-weight:600;">Password</label>
      <input type="password" id="ppass" placeholder="Masukkan password">
      <div id="startErr" class="warn-box" style="display:none;"></div>
      <div class="navrow" style="justify-content:flex-end;">
        <button class="btn-primary" id="startBtn">Login & mulai tes →</button>
      </div>
    </div>
  `;
  document.getElementById("startBtn").onclick = async () => {
    const nim = document.getElementById("pnim").value.trim();
    const pass = document.getElementById("ppass").value.trim();
    const errBox = document.getElementById("startErr");
    errBox.style.display = "none";
    if(!nim || !pass){
      errBox.textContent = "Isi NIM dan password terlebih dahulu.";
      errBox.style.display = "block";
      return;
    }
    const btn = document.getElementById("startBtn");
    btn.disabled = true;
    btn.textContent = "Memeriksa...";
    try{
      const res = await fetch(RESULTS_WEBHOOK_URL, {
        method:"POST",
        body: JSON.stringify({ action:"login", nim, password: pass })
      });
      const result = await res.json();
      if(result.valid){
        state.participant = {name: result.name, id: result.nim || nim};
        state.screen = "listening";
        render();
      } else {
        errBox.textContent = "NIM atau password salah, atau belum terdaftar. Hubungi panitia jika ini keliru.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login & mulai tes →";
      }
    } catch(e){
      errBox.textContent = "Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Login & mulai tes →";
    }
  };
}

/* =========================================================
   RENDER: LISTENING SCREEN (single continuous audio)
========================================================= */
let listenAudioEl = null;
function renderListening(){
  const played = state.listeningPlayed;
  const started = state.listeningStarted;

  const groupsHtml = (() => {
    let html = "";
    let lastPart = null;
    listeningItems.forEach(it => {
      if(it.part !== lastPart){
        html += `<div class="listen-part-label">${it.part}</div>`;
        lastPart = it.part;
      }
      const selected = state.answers[it.id];
      html += `
        <div class="listen-item">
          <div class="qnum">Soal No. ${it.id}</div>
          ${it.q ? `<div class="stem">${it.q}</div>` : ""}
          <div>
            ${it.choices.map((c,i)=>`
              <label class="choice ${selected===i?'selected':''}">
                <input type="radio" name="lq_${it.id}" value="${i}" ${selected===i?"checked":""}>
                <span>${String.fromCharCode(65+i)}. ${c}</span>
              </label>
            `).join("")}
          </div>
        </div>
      `;
    });
    return html;
  })();

  app.innerHTML = `
    <div class="topbar">
      <div><div class="label">Section 1</div><div class="section-name">Listening Comprehension</div></div>
      <div class="timer">${listeningItems.length} soal</div>
    </div>
    <div class="card">
      <p class="instructions">Audio akan diputar SATU KALI dari awal sampai akhir (durasi ± 31 menit, termasuk instruksi Part A, B, dan C). Anda tidak dapat menjeda atau mengulang. Dengarkan baik-baik dan jawab semua soal di bawah selama audio diputar.</p>
      <div class="audio-box">
        <button class="play-btn" id="playBtn" ${started?"disabled":""}>${played?"✓":"▶"}</button>
        <div style="flex:1;">
          <div class="audio-meta">${played ? "Audio selesai diputar." : (started ? "Sedang diputar — dengarkan baik-baik." : "Klik untuk memulai audio listening (hanya 1 kali).")}</div>
          <div class="audio-progress"><div class="audio-progress-fill" id="audioFill"></div></div>
          <div class="audio-time" id="audioTime">0:00 / 0:00</div>
        </div>
      </div>
      ${groupsHtml}
    </div>
    <div class="navrow" style="justify-content:flex-end;">
      <button class="btn-primary" id="nextBtn" ${played?"":"disabled"}>Lanjut ke Structure →</button>
    </div>
    ${played ? "" : `<p class="muted" style="text-align:center;">Tombol lanjut akan aktif setelah audio selesai diputar.</p>`}
  `;

  document.querySelectorAll('input[type=radio][name^="lq_"]').forEach(radio=>{
    radio.onchange = (e)=>{
      const qid = parseInt(e.target.name.split("_")[1]);
      state.answers[qid] = parseInt(e.target.value);
      const container = e.target.closest(".listen-item");
      container.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));
      e.target.closest(".choice").classList.add("selected");
    };
  });

  const playBtn = document.getElementById("playBtn");
  const fill = document.getElementById("audioFill");
  const timeDisp = document.getElementById("audioTime");
  if(!started){
    playBtn.onclick = () => {
      state.listeningStarted = true;
      listenAudioEl = new Audio(LISTENING_AUDIO);
      playBtn.disabled = true;
      const metaEl = document.querySelector(".audio-meta");
      if(metaEl) metaEl.textContent = "Sedang diputar — dengarkan baik-baik.";
      listenAudioEl.play();
      listenAudioEl.ontimeupdate = () => {
        if(listenAudioEl.duration){
          fill.style.width = (listenAudioEl.currentTime/listenAudioEl.duration*100)+"%";
          timeDisp.textContent = fmtTime(listenAudioEl.currentTime)+" / "+fmtTime(listenAudioEl.duration);
        }
      };
      listenAudioEl.onended = () => {
        state.listeningPlayed = true;
        render();
      };
    };
  }

  document.getElementById("nextBtn").onclick = () => {
    if(!state.listeningPlayed) return;
    state.screen = "test";
    state.idx = 0;
    state.sectionStart["Structure"] = Date.now();
    render();
  };
}

function renderQuestion(){
  const it = items[state.idx];
  const sec = it.section;
  const secIdxs = sectionIndices(sec);
  const posInSec = secIdxs.indexOf(state.idx)+1;

  const total = SECTION_TIME[sec.toLowerCase()];
  const elapsed = (Date.now() - state.sectionStart[sec])/1000;
  const remain = total - elapsed;
  const warn = remain < 120;
  const timerHtml = `<div class="timer ${warn?'warn':''}" id="timerDisplay">${fmtTime(remain)}</div>`;

  let passageHtml = "";
  if(it.passage){
    passageHtml = `<div class="passage"><h4>${it.passageTitle}</h4><div>${it.passage.replace(/\n\n/g,"<br><br>")}</div></div>`;
  }

  const selected = state.answers[it.id];
  const choicesHtml = it.choices.map((c,i)=>`
    <label class="choice ${selected===i?'selected':''}">
      <input type="radio" name="choice" value="${i}" ${selected===i?"checked":""}>
      <span>${String.fromCharCode(65+i)}. ${c}</span>
    </label>
  `).join("");

  const isLastOverall = state.idx === items.length-1;

  app.innerHTML = `
    <div class="topbar">
      <div><div class="label">${it.section} • Soal ${posInSec}/${secIdxs.length}</div><div class="section-name">${it.part}</div></div>
      ${timerHtml}
    </div>
    <div class="card">
      ${passageHtml}
      <div class="qnum">Soal No. ${it.id}</div>
      <div class="stem">${it.q}</div>
      <div id="choicesWrap">${choicesHtml}</div>
    </div>
    <div class="navrow">
      <button id="prevBtn" ${state.idx===0?"disabled":""}>← Sebelumnya</button>
      <button class="btn-primary" id="nextBtn">${isLastOverall ? "Selesai & kirim" : "Selanjutnya →"}</button>
    </div>
    <div class="palette">
      ${secIdxs.map(i => `<button data-jump="${i}" class="${i===state.idx?'current':(state.answers[items[i].id]!==undefined?'answered':'')}">${items[i].id}</button>`).join("")}
    </div>
  `;

  document.querySelectorAll('input[name="choice"]').forEach(radio=>{
    radio.onchange = (e)=>{
      state.answers[it.id] = parseInt(e.target.value);
      document.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));
      e.target.closest(".choice").classList.add("selected");
    };
  });

  document.getElementById("prevBtn").onclick = ()=>{ if(state.idx>0){ state.idx--; render(); } };
  document.getElementById("nextBtn").onclick = ()=>{
    const nextIdx = state.idx+1;
    if(nextIdx < items.length){
      const nextSec = items[nextIdx].section;
      if(nextSec !== sec) state.sectionStart[nextSec] = Date.now();
      state.idx = nextIdx;
      render();
    } else {
      finishTest();
    }
  };
  document.querySelectorAll("[data-jump]").forEach(b=>{
    b.onclick = ()=>{ state.idx = parseInt(b.dataset.jump); render(); };
  });

  startSectionTimerTick(sec);
}

let tickInterval = null;
function startSectionTimerTick(sec){
  if(tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(()=>{
    const total = SECTION_TIME[sec.toLowerCase()];
    const elapsed = (Date.now() - state.sectionStart[sec])/1000;
    const remain = total - elapsed;
    const disp = document.getElementById("timerDisplay");
    if(disp){
      disp.textContent = fmtTime(remain);
      if(remain < 120) disp.classList.add("warn");
    }
    if(remain <= 0){
      clearInterval(tickInterval);
      advanceToNextSectionOrFinish(sec);
    }
  }, 1000);
}
function advanceToNextSectionOrFinish(sec){
  const secIdxs = sectionIndices(sec);
  const lastIdxOfSec = secIdxs[secIdxs.length-1];
  if(lastIdxOfSec === items.length-1){
    finishTest();
  } else {
    state.idx = lastIdxOfSec+1;
    state.sectionStart[items[state.idx].section] = Date.now();
    render();
  }
}

/* =========================================================
   SCORING + FINISH
========================================================= */
function computeScore(){
  const bySec = {Listening:{correct:0,total:0}, Structure:{correct:0,total:0}, Reading:{correct:0,total:0}};
  listeningItems.forEach(it=>{
    bySec.Listening.total++;
    if(state.answers[it.id] === it.answer) bySec.Listening.correct++;
  });
  items.forEach(it=>{
    bySec[it.section].total++;
    if(state.answers[it.id] === it.answer) bySec[it.section].correct++;
  });
  return bySec;
}

function estimateScaledScore(correct, total, maxScale){
  if(total === 0) return 31;
  const pct = correct/total;
  const scaled = 31 + pct*(maxScale-31);
  return Math.round(scaled);
}

async function finishTest(){
  if(tickInterval) clearInterval(tickInterval);
  state.screen = "done";
  const scores = computeScore();
  const total = scores.Listening.correct + scores.Structure.correct + scores.Reading.correct;
  const totalQ = listeningItems.length + items.length;

  const listeningScaled = estimateScaledScore(scores.Listening.correct, scores.Listening.total, 68);
  const structureScaled = estimateScaledScore(scores.Structure.correct, scores.Structure.total, 68);
  const readingScaled = estimateScaledScore(scores.Reading.correct, scores.Reading.total, 67);
  const estimatedTotal = Math.round((listeningScaled + structureScaled + readingScaled) * 10 / 3);

  const payload = {
    name: state.participant.name,
    participantId: state.participant.id,
    timestamp: new Date().toISOString(),
    listeningScore: scores.Listening.correct, listeningTotal: scores.Listening.total,
    structureScore: scores.Structure.correct, structureTotal: scores.Structure.total,
    readingScore: scores.Reading.correct, readingTotal: scores.Reading.total,
    totalScore: total, totalQuestions: totalQ,
    listeningScaledEst: listeningScaled,
    structureScaledEst: structureScaled,
    readingScaledEst: readingScaled,
    estimatedToeflTotal: estimatedTotal,
    answers: state.answers,
  };

  let sent = false;
  if(RESULTS_WEBHOOK_URL){
    try{
      const res = await fetch(RESULTS_WEBHOOK_URL, {
        method:"POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      sent = result && result.status === "ok";
    } catch(e){ sent = false; }
  }

  app.innerHTML = `
    <div class="card">
      <h1>Tes selesai</h1>
      <p class="muted">${state.participant.name} • ${state.participant.id}</p>
      <div class="score-grid">
        <div class="score-cell"><div class="num">${scores.Listening.correct}/${scores.Listening.total}</div><div class="lbl">Listening</div></div>
        <div class="score-cell"><div class="num">${scores.Structure.correct}/${scores.Structure.total}</div><div class="lbl">Structure</div></div>
        <div class="score-cell"><div class="num">${scores.Reading.correct}/${scores.Reading.total}</div><div class="lbl">Reading</div></div>
      </div>
      <p style="text-align:center; font-size:14px; color:var(--ink-soft);">Jawaban benar: ${total} / ${totalQ}</p>

      <div style="border-top:1px solid var(--line); margin:18px 0; padding-top:18px;">
        <p style="font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:12px;">Estimasi Skor Skala TOEFL ITP</p>
        <div class="score-grid">
          <div class="score-cell"><div class="num">${listeningScaled}</div><div class="lbl">Listening (31–68)</div></div>
          <div class="score-cell"><div class="num">${structureScaled}</div><div class="lbl">Structure (31–68)</div></div>
          <div class="score-cell"><div class="num">${readingScaled}</div><div class="lbl">Reading (31–67)</div></div>
        </div>
        <p style="text-align:center; font-size:22px; font-weight:700; color:var(--accent);">Estimasi Total: ${estimatedTotal}</p>
        <p style="font-size:12px; color:var(--ink-soft); text-align:center; font-style:italic;">Ini estimasi berdasarkan proporsi jawaban benar, BUKAN skor resmi ETS. Skor TOEFL ITP asli dihitung ETS memakai kalibrasi statistik tingkat kesulitan soal yang tidak dipublikasikan.</p>
      </div>

      ${RESULTS_WEBHOOK_URL
        ? (sent ? `<div class="ok-box">Hasil berhasil dikirim ke sistem penyelenggara.</div>`
                : `<div class="warn-box">Gagal mengirim hasil otomatis. Silakan unduh hasil di bawah dan kirimkan manual ke penyelenggara.</div>`)
        : `<div class="warn-box">Pengiriman otomatis belum diaktifkan. Silakan unduh hasil di bawah.</div>`
      }
      <div class="navrow" style="justify-content:center; margin-top:20px;">
        <button class="btn-primary" id="downloadBtn">Unduh hasil (JSON)</button>
      </div>
    </div>
  `;
  document.getElementById("downloadBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `toefl_result_${state.participant.id}.json`;
    a.click();
  };
}

/* =========================================================
   MAIN RENDER DISPATCH
========================================================= */
function render(){
  if(state.screen === "start") renderStart();
  else if(state.screen === "listening") renderListening();
  else if(state.screen === "test") renderQuestion();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL Practice Test</title>
<style>
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --ink:#1C2333; --ink-soft:#5B6478;
    --line:#E2E5EB; --accent:#3450A3; --accent-soft:#EAEEFA;
    --danger:#B3432B; --danger-soft:#FBEDE8; --ok:#2C7A57; --ok-soft:#E8F4EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:720px; margin:0 auto; padding:24px 20px 80px;}
  .topbar{
    position:sticky; top:0; background:var(--bg); padding:14px 0; z-index:10;
    display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .topbar .label{font-size:13px; color:var(--ink-soft);}
  .topbar .section-name{font-size:16px; font-weight:600;}
  .timer{
    font-variant-numeric:tabular-nums; font-size:15px; font-weight:600;
    background:var(--accent-soft); color:var(--accent); padding:6px 14px; border-radius:8px;
  }
  .timer.warn{background:var(--danger-soft); color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; margin-bottom:20px;
  }
  h1{font-size:26px; margin:0 0 8px;}
  h2{font-size:19px; margin:0 0 4px;}
  h3{font-size:15px; color:var(--ink-soft); font-weight:600; margin:0 0 16px; text-transform:none;}
  p{margin:0 0 14px;}
  .muted{color:var(--ink-soft); font-size:14px;}
  input[type=text]{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; margin-bottom:14px; font-family:inherit;
  }
  button{
    font-family:inherit; font-size:14px; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:#fff; padding:10px 18px; color:var(--ink); transition:background .15s;
  }
  button:hover{background:#F1F2F5;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .btn-primary:hover{background:#2A4183;}
  .btn-primary:disabled{background:var(--accent); opacity:.4;}
  .navrow{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
  .audio-box{
    display:flex; align-items:center; gap:14px; background:var(--accent-soft);
    border-radius:10px; padding:14px 16px; margin-bottom:20px;
  }
  .play-btn{
    width:42px; height:42px; border-radius:50%; background:var(--accent); border:none;
    color:#fff; font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .play-btn:disabled{background:#9AA6C4;}
  .audio-meta{font-size:13px; color:var(--accent); flex:1;}
  .audio-progress{height:4px; background:#D3DAF0; border-radius:2px; margin-top:6px; overflow:hidden;}
  .audio-progress-fill{height:100%; background:var(--accent); width:0%;}
  .qnum{font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .stem{font-size:16px; margin-bottom:16px;}
  .choice{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; margin-bottom:9px; cursor:pointer;
  }
  .choice:hover{border-color:#B9C0D6;}
  .choice.selected{border-color:var(--accent); background:var(--accent-soft);}
  .choice input{margin-top:3px;}
  .passage{
    background:#FBFBFC; border:1px solid var(--line); border-radius:10px; padding:18px 20px;
    margin-bottom:20px; font-size:15px; max-height:340px; overflow-y:auto;
  }
  .passage h4{margin:0 0 10px; font-size:15px;}
  .palette{display:flex; flex-wrap:wrap; gap:6px; margin-top:18px;}
  .palette button{
    width:32px; height:32px; padding:0; font-size:12px; border-radius:6px;
  }
  .palette button.answered{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
  .palette button.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .instructions{font-size:14px; color:var(--ink-soft); font-style:italic; margin-bottom:18px;}
  .score-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:20px 0;}
  .score-cell{background:var(--accent-soft); border-radius:10px; padding:16px; text-align:center;}
  .score-cell .num{font-size:26px; font-weight:700; color:var(--accent);}
  .score-cell .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .warn-box{background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:12px 14px; font-size:13px; margin-top:10px;}
  .ok-box{background:var(--ok-soft); color:var(--ok); border-radius:8px; padding:12px 14px; font-size:13px; margin-top:10px;}
  a{color:var(--accent);}
</style>
</head>

function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), sec = s%60;
  return m+":"+String(sec).padStart(2,"0");
}

function currentSection(){ return items[state.idx] ? items[state.idx].section : null; }

function sectionIndices(sec){
  return items.map((it,i)=>({it,i})).filter(x=>x.it.section===sec).map(x=>x.i);
}

      <div id="startErr" class="warn-box" style="display:none;">Isi nama dan nomor peserta terlebih dahulu.</div>
      <div class="navrow" style="justify-content:flex-end;">
        <button class="btn-primary" id="startBtn">Mulai tes →</button>
      </div>
    </div>
  `;
  document.getElementById("startBtn").onclick = () => {
    const name = document.getElementById("pname").value.trim();
    const id = document.getElementById("pid").value.trim();
    if(!name || !id){ document.getElementById("startErr").style.display="block"; return; }
    state.participant = {name, id};
    state.screen = "test";
    state.idx = 0;
    state.sectionStart[currentSection()] = Date.now();
    render();
  };
}

/* =========================================================
   AUDIO PLAYER COMPONENT
========================================================= */
let audioEl = null;
function renderAudioBox(src, key){
  const played = !!state.playedAudio[key];
  return `
    <div class="audio-box">
      <button class="play-btn" id="playBtn" ${played?"disabled":""}>${played?'<i>✓</i>':'▶'}</button>
      <div style="flex:1;">
        <div class="audio-meta">${played ? "Audio telah diputar — tidak dapat diulang" : "Klik untuk memutar audio (hanya 1 kali)"}</div>
        <div class="audio-progress"><div class="audio-progress-fill" id="audioFill"></div></div>
      </div>
    </div>
  `;
}
function wireAudio(src, key){
  const btn = document.getElementById("playBtn");
  const fill = document.getElementById("audioFill");
  if(!btn || state.playedAudio[key]) return;
  btn.onclick = () => {
    if(audioEl){ audioEl.pause(); }
    audioEl = new Audio(src);
    btn.disabled = true;
    audioEl.play();
    audioEl.ontimeupdate = () => {
      if(audioEl.duration) fill.style.width = (audioEl.currentTime/audioEl.duration*100)+"%";
    };
    audioEl.onended = () => {
      state.playedAudio[key] = true;
      fill.style.width = "100%";
      renderQuestion();
    };
  };
}

/* =========================================================
   RENDER: TEST QUESTION
========================================================= */
function renderQuestion(){
  const it = items[state.idx];
  const sec = it.section;
  const secIdxs = sectionIndices(sec);
  const posInSec = secIdxs.indexOf(state.idx)+1;

  let timerHtml = "";
  if(sec !== "Listening"){
    const total = SECTION_TIME[sec.toLowerCase()];
    const elapsed = (Date.now() - state.sectionStart[sec])/1000;
    const remain = total - elapsed;
    const warn = remain < 120;
    timerHtml = `<div class="timer ${warn?'warn':''}" id="timerDisplay">${fmtTime(remain)}</div>`;
  } else {
    timerHtml = `<div class="timer">Soal ${posInSec} / ${secIdxs.length}</div>`;
  }

  let audioHtml = "";
  const audioKey = it.groupAudio || it.audio;
  if(it.audio && !it.groupAudio){
    audioHtml = renderAudioBox(it.audio, "single_"+it.id);
  } else if(it.groupAudio){
    audioHtml = renderAudioBox(it.groupAudio, "group_"+it.part);
  }

  let passageHtml = "";
  if(it.passage){
    passageHtml = `<div class="passage"><h4>${it.passageTitle}</h4><div>${it.passage}</div></div>`;
  }

  const selected = state.answers[it.id];
  const choicesHtml = it.choices.map((c,i)=>`
    <label class="choice ${selected===i?'selected':''}">
      <input type="radio" name="choice" value="${i}" ${selected===i?"checked":""}>
      <span>${String.fromCharCode(65+i)}. ${c}</span>
    </label>
  `).join("");

  const isLastOverall = state.idx === items.length-1;
  const canReplay = it.audio || it.groupAudio;
  const audioBlocking = false; // navigation not blocked by audio, matches practical use

  app.innerHTML = `
    <div class="topbar">
      <div><div class="label">${it.section}</div><div class="section-name">${it.part}</div></div>
      ${timerHtml}
    </div>
    <div class="card">
      ${passageHtml}
      ${audioHtml}
      <div class="qnum">Soal No. ${it.id}</div>
      <div class="stem">${it.q}</div>
      <div id="choicesWrap">${choicesHtml}</div>
    </div>
    <div class="navrow">
      <button id="prevBtn" ${state.idx===0?"disabled":""}>← Sebelumnya</button>
      <button class="btn-primary" id="nextBtn">${isLastOverall ? "Selesai & kirim" : "Selanjutnya →"}</button>
    </div>
    <div class="palette">
      ${secIdxs.map(i => `<button data-jump="${i}" class="${i===state.idx?'current':(state.answers[items[i].id]!==undefined?'answered':'')}">${items[i].id}</button>`).join("")}
    </div>
  `;

  if(audioKey) wireAudio(it.audio || it.groupAudio, it.groupAudio ? "group_"+it.part : "single_"+it.id);

  document.querySelectorAll('input[name="choice"]').forEach(radio=>{
    radio.onchange = (e)=>{
      state.answers[it.id] = parseInt(e.target.value);
      document.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));
      e.target.closest(".choice").classList.add("selected");
    };
  });

  document.getElementById("prevBtn").onclick = ()=>{ if(state.idx>0){ state.idx--; render(); } };
  document.getElementById("nextBtn").onclick = ()=>{
    const nextIdx = state.idx+1;
    if(nextIdx < items.length){
      const nextSec = items[nextIdx].section;
      if(nextSec !== sec){
        state.sectionStart[nextSec] = Date.now();
      }
      state.idx = nextIdx;
      render();
    } else {
      finishTest();
    }
  };
  document.querySelectorAll("[data-jump]").forEach(b=>{
    b.onclick = ()=>{ state.idx = parseInt(b.dataset.jump); render(); };
  });

  if(sec !== "Listening"){
    startSectionTimerTick(sec);
  }
}

let tickInterval = null;
function startSectionTimerTick(sec){
  if(tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(()=>{
    const total = SECTION_TIME[sec.toLowerCase()];
    const elapsed = (Date.now() - state.sectionStart[sec])/1000;
    const remain = total - elapsed;
    const disp = document.getElementById("timerDisplay");
    if(disp){
      disp.textContent = fmtTime(remain);
      if(remain < 120) disp.classList.add("warn");
    }
    if(remain <= 0){
      clearInterval(tickInterval);
      advanceToNextSectionOrFinish(sec);
    }
  }, 1000);
}
function advanceToNextSectionOrFinish(sec){
  const secIdxs = sectionIndices(sec);
  const lastIdxOfSec = secIdxs[secIdxs.length-1];
  if(lastIdxOfSec === items.length-1){
    finishTest();
  } else {
    state.idx = lastIdxOfSec+1;
    state.sectionStart[items[state.idx].section] = Date.now();
    render();
  }
}

/* =========================================================
   SCORING + FINISH
========================================================= */
function computeScore(){
  const bySec = {Listening:{correct:0,total:0}, Structure:{correct:0,total:0}, Reading:{correct:0,total:0}};
  items.forEach(it=>{
    bySec[it.section].total++;
    if(state.answers[it.id] === it.answer) bySec[it.section].correct++;
  });
  return bySec;
}

async function finishTest(){
  if(tickInterval) clearInterval(tickInterval);
  state.screen = "done";
  const scores = computeScore();
  const total = scores.Listening.correct + scores.Structure.correct + scores.Reading.correct;
  const totalQ = items.length;

  const payload = {
    name: state.participant.name,
    participantId: state.participant.id,
    timestamp: new Date().toISOString(),
    listeningScore: scores.Listening.correct, listeningTotal: scores.Listening.total,
    structureScore: scores.Structure.correct, structureTotal: scores.Structure.total,
    readingScore: scores.Reading.correct, readingTotal: scores.Reading.total,
    totalScore: total, totalQuestions: totalQ,
    answers: state.answers,
  };

  let sent = false;
  if(RESULTS_WEBHOOK_URL){
    try{
      await fetch(RESULTS_WEBHOOK_URL, {
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      sent = true;
    } catch(e){ sent = false; }
  }

  app.innerHTML = `
    <div class="card">
      <h1>Tes selesai</h1>
      <p class="muted">${state.participant.name} • ${state.participant.id}</p>
      <div class="score-grid">
        <div class="score-cell"><div class="num">${scores.Listening.correct}/${scores.Listening.total}</div><div class="lbl">Listening</div></div>
        <div class="score-cell"><div class="num">${scores.Structure.correct}/${scores.Structure.total}</div><div class="lbl">Structure</div></div>
        <div class="score-cell"><div class="num">${scores.Reading.correct}/${scores.Reading.total}</div><div class="lbl">Reading</div></div>
      </div>
      <p style="text-align:center; font-size:18px; font-weight:700;">Total: ${total} / ${totalQ}</p>
      ${RESULTS_WEBHOOK_URL
        ? (sent ? `<div class="ok-box">Hasil berhasil dikirim ke sistem penyelenggara.</div>`
                : `<div class="warn-box">Gagal mengirim hasil otomatis. Silakan unduh hasil di bawah dan kirimkan manual ke penyelenggara.</div>`)
        : `<div class="warn-box">Pengiriman otomatis belum diaktifkan oleh penyelenggara. Silakan unduh hasil di bawah dan kirimkan ke penyelenggara.</div>`
      }
      <div class="navrow" style="justify-content:center; margin-top:20px;">
        <button class="btn-primary" id="downloadBtn">Unduh hasil (JSON)</button>
      </div>
    </div>
  `;
  document.getElementById("downloadBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `toefl_result_${state.participant.id}.json`;
    a.click();
  };
}

/* =========================================================
   MAIN RENDER DISPATCH
========================================================= */
function render(){
  if(state.screen === "start") renderStart();
  else if(state.screen === "test") renderQuestion();
}

render();
</script>
</body>
</html>
